################################################################################
# Kubernetes deployment manifest.                                              #
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: default
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
      - image: "us-central1-docker.pkg.dev/default-4/default/default:$GITHUB_SHA"
        env:
          - name: GIT_EMAIL
            value: "17555162+jon-hawks@users.noreply.github.com"
          - name: GIT_KEY
            value: "$GIT_KEY"
          - name: GIT_USER
            value: "Jon Hawks"
          - name: GIT_REPO
            value: "$GITHUB_REPOSITORY"
        name: default
