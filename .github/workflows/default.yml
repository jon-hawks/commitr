################################################################################
# This pipeline validates that the code builds, is linted properly, passes     #
# unit tests, and passes a security audit.                                     #
################################################################################
name: default

on: push

# Pipeline.
jobs:

  # Verification stage.
  verify:
    runs-on: ubuntu-latest
    steps:

    # Checkout this repository. Note: this should likely always come first.
    - name: Checkout Repository
      uses: actions/checkout@main

    # Install and run a linter.
    - name: Lint
      run: |-
        shellcheck commit.sh

  # Build and deploy this code (e.g. to a Kubernetes cluster).
  deploy:
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:

    # Checkout this repository. Note: this should likely always come first.
    - name: Checkout Repository
      uses: actions/checkout@main

    # Configure a Workload Identity federation for Google Cloud and generate an access token.
    - id: auth
      name: Authenticate to Google Cloud
      uses: google-github-actions/auth@main
      with:
        token_format: access_token
        workload_identity_provider: projects/921831209165/locations/global/workloadIdentityPools/default/providers/default
        service_account: default@default-4.iam.gserviceaccount.com

    # Configure Docker to use our OAuth 2.0 access token.
    - name: Configure Docker
      run: |-
        echo ${{ steps.auth.outputs.access_token }} | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev

    # Get the GKE credentials so we can deploy to the cluster.
    - name: Setup GKE credentials
      uses: google-github-actions/get-gke-credentials@main
      with:
        cluster_name: projects/default-4/locations/us-central1-a/clusters/default

    # Build the Docker image.
    - name: Build
      run: |-
        docker build --tag "us-central1-docker.pkg.dev/default-4/default/default:$GITHUB_SHA" .

    # Push the Docker image to Google Artifact Registry.
    - name: Publish
      run: |-
        docker push "us-central1-docker.pkg.dev/default-4/default/default:$GITHUB_SHA"

    # Deploy the Docker image to the GKE cluster.
    - name: Deploy
      run: |-
        export GIT_KEY=$(echo "${{ secrets.GIT_KEY }}" | base64)
        envsubst < .deployment.yml | kubectl apply -f -
