################################################################################
# Validate, build, and redeploy main; the running pod triggers the next push.    #
################################################################################
name: default

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Finish each deployment before another run can change production.
concurrency:
  group: commitr-${{ github.ref }}
  cancel-in-progress: false

# Preserve existing secrets; defaults describe this repository's GKE deployment.
env:
  PROJECT_ID: ${{ secrets.GCP_ID || 'default-4' }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION || 'us-central1' }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY || 'default' }}
  GAR_IMAGE: ${{ secrets.GAR_IMAGE || 'default' }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER || 'default' }}
  GKE_ZONE: ${{ secrets.GKE_ZONE || 'us-central1-a' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        run: shellcheck commit.sh deploy.sh
      - name: Test commit cycle and deployment
        run: python3 -m unittest discover -s tests -v

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build before acquiring short-lived Google credentials.
      - name: Build
        run: |
          image_uri="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$GAR_IMAGE:$GITHUB_SHA"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"
          docker build --tag "$image_uri" .

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          workload_identity_provider: projects/921831209165/locations/global/workloadIdentityPools/default/providers/default
          service_account: default@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Configure Docker and publish
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$GAR_LOCATION-docker.pkg.dev"
          docker push "$IMAGE_URI"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Deploy and verify rollout
        env:
          GIT_KEY: ${{ secrets.GIT_KEY }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_USER: ${{ secrets.GIT_USER }}
        run: sh deploy.sh
